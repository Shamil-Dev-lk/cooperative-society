<!DOCTYPE html>
<html lang="si">
  <head>
    <meta charset="UTF-8" />
    <title>Cooperative Society</title>
    <script>
      // Universal SPA redirect for GitHub Pages (handles both project site & root domain)
      (function () {
        var l = window.location;
        var path = l.pathname || '';
        var search = l.search || '';
        var hash = l.hash || '';

        var basePath = '';
        var routePath = path;

        if (path.indexOf('/cooperative-society') === 0) {
          basePath = '/cooperative-society';
          routePath = path.replace(/^\/cooperative-society/, '');
        }

        routePath = routePath.replace(/\/$/, '');
        if (!routePath || routePath === '/') {
          routePath = '/dashboard';
        }

        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath + '/#' + routePath + search + hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
